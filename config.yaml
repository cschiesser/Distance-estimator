# Daten
data_dir: "./data"
load_rgb: true
downsample_factor: 5

# Split
val_size: 0.2
random_seed: 42

# Cross-Validation
use_cv: true
cv_folds: 5

# HGB-Parameter (Meta-Learner im Stacking)
model_params:
  max_iter: 1200
  learning_rate: 0.03
  max_depth: 8
  l2_regularization: 1.0
  min_samples_leaf: 30
  loss: "absolute_error"

# kNN-Parameter (Base-Learner im Stacking)
knn_params:
  n_neighbors: 3
  weights: "distance"

# ExtraTrees-Parameter (zweiter Base-Learner im Stacking)
et_params:
  n_estimators: 500
  max_features: "sqrt"
  min_samples_leaf: 5

# RandomForest haben wir getestet - kein signifikanter Gewinn weil zu aehnlich
# zu HGB/ExtraTrees. PCA haben wir getestet - HGB findet Feature-Kombinationen
# selbst, PCA war redundant.

# Multi-Seed Bagging: n Modelle mit verschiedenen Seeds, Predictions gemittelt
bagging_seeds: [42, 123, 456]

# Output
save_predictions: true